<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Valleys Transport & Hauling | Rate Estimator</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
  .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 5px solid #1a365d; }
  .logo { display: block; margin: 0 auto 15px auto; max-width: 130px; height: auto; }
  h2 { text-align: center; color: #1a365d; margin-top: 0; }
  label { font-weight: bold; display: block; margin-top: 15px; }
  select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  .note { font-size: 0.85em; color: #666; margin-top: 5px; font-style: italic; }
  .result { margin-top: 20px; padding: 15px; background: #e2e8f0; text-align: center; font-size: 1.2em; font-weight: bold; border-radius: 4px; }
</style>
</head>
<body>

<div class="container">
  <!-- This is where your badge goes -->
  <img src="https://github.com/user-attachments/assets/aaba20ae-0ae6-4935-a4f0-6b0e9ef1f3d3" alt="Three Valleys Transport Badge" class="logo">
  
  <h2>Three Valleys Transport Estimator</h2>
  <p style="text-align:center; font-size: 0.9em;">Dependable 4x4 local link for Raystown, Kishacoquillas, and Happy Valley.</p>
  
  <label for="zone">1. Select Pickup Location:</label>
  <select id="zone" onchange="calculate()">
    <option value="1">Zone 1</option>
    <option value="2">Zone 2</option>
    <option value="3">Zone 3</option>
  </select>

  <label for="service">2. Select Service Type:</label>
  <select id="service" onchange="calculate()">
    <option value="0">-- Choose a Service --</option>
    <option value="local">Local Rides & Light Cargo</option>
    <option value="heavy_light">Heavy Hauling (Under 4,000 lbs)</option>
    <option value="heavy_heavy">Heavy Hauling (4,000 - 8,000 lbs)</option>
    <option value="junk">Junk Removal & Firewood</option>
  </select>
  <div id="service-desc" class="note"></div>

  <label for="miles">3. Estimated Loaded Miles (One-Way):</label>
  <input type="number" id="miles" min="0" placeholder="Enter one-way miles" oninput="calculate()">

  <div class="result" id="total-cost">Estimated Total: $0.00</div>
  <div id="fee-breakdown" class="note" style="text-align:center; margin-top: 10px; font-weight: bold; color: #1a365d;"></div>
  
  <p class="note" style="text-align:center; margin-top: 15px;">*This is a one-way estimate. Standby time ($5.00/15 mins after first 10) and local dump fees ($30 up to 600 lbs) are not included.</p>
</div>

<script>
function calculate() {
  const zone = document.getElementById('zone').value;
  const service = document.getElementById('service').value;
  const miles = parseFloat(document.getElementById('miles').value) || 0;
  
  const totalDiv = document.getElementById('total-cost');
  const descDiv = document.getElementById('service-desc');
  const breakdownDiv = document.getElementById('fee-breakdown');

  let zoneBase = 0;
  let perMile = 0;
  let desc = "";

  // Flyer Match Logic
  if (service === 'local') {
    perMile = 1.50;
    desc = "Clean F-150 SuperCrew (seats up to 4 + gear). Covered bed keeps gear completely dry.";
    if (zone === '1') zoneBase = 15;
    if (zone === '2') zoneBase = 25;
    if (zone === '3') zoneBase = 35;
  } else if (service === 'heavy_light') {
    perMile = 2.50;
    desc = "Perfect for utility trailers, cargo, and move-out goods. No vehicle towing.";
    if (zone === '1') zoneBase = 50;
    if (zone === '2') zoneBase = 80;
    if (zone === '3') zoneBase = 110;
  } else if (service === 'heavy_heavy') {
    perMile = 4.00;
    desc = "Heavy-duty hauling for larger loads and equipment. No vehicle towing.";
    if (zone === '1') zoneBase = 75;
    if (zone === '2') zoneBase = 95;
    if (zone === '3') zoneBase = 135;
  } else if (service === 'junk') {
    perMile = 1.50;
    desc = "Muscle & labor fully included. Local dump fees passed directly to you with zero markups.";
    if (zone === '1') zoneBase = 75;
    if (zone === '2') zoneBase = 85;
    if (zone === '3') zoneBase = 105;
  }

  descDiv.innerText = desc;
  
  if (service !== "0") {
    const total = zoneBase + (perMile * miles);
    
    totalDiv.innerText = "Estimated Total: $" + total.toFixed(2);
    breakdownDiv.innerText = "Zone Base Fee Applied: $" + zoneBase.toFixed(2);
  } else {
    totalDiv.innerText = "Estimated Total: $0.00";
    breakdownDiv.innerText = "";
  }
}
</script>
</body>
</html>
